---
- name: Install kubectl on the Raspberry Pi lab
  hosts: lab
  become: true
  vars:
    kubectl_version: v1.37.0
    kubectl_sha256: 922df28df248cc00a9e025f947704f1d1482de64ece54cfe57e61f19eaf1eef3

  pre_tasks:
    - name: Check the supported platform
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['architecture'] == 'aarch64'
        fail_msg: This playbook installs the Linux ARM64 binary for Raspberry Pi.

  tasks:
    - name: Install the verified kubectl binary
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/arm64/kubectl"
        checksum: "sha256:{{ kubectl_sha256 }}"
        dest: /usr/local/bin/kubectl
        owner: root
        group: root
        mode: '0755'
        timeout: 60

    - name: Verify kubectl runs without connecting to a cluster
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - version
          - --client
      changed_when: false
      when: not ansible_check_mode
